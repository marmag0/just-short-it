name: just-short-it

services:
  shortener:
    build:
      context: .
      dockerfile: services/shortener/deploy/Dockerfile
      args:
        SHORTENER_PORT: ${SHORTENER_PORT:?Set SHORTENER_PORT in .env}
    restart: unless-stopped
    environment:
      SHORTENER_PORT: ${SHORTENER_PORT:?Set SHORTENER_PORT in .env}
    ports:
      - "127.0.0.1:${SHORTENER_PORT:?Set SHORTENER_PORT in .env}:${SHORTENER_PORT:?Set SHORTENER_PORT in .env}"
    labels:
      observability.logs: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----- observability stack - GRAFANA -----
  grafana:
    image: grafana/grafana:13.3
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:?Set GRAFANA_PORT in .env}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:?Set GRAFANA_PORT in .env}:${GRAFANA_PORT:?Set GRAFANA_PORT in .env}"
    volumes:
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo

  # ----- observability stack - LOKI -----
  loki:
    image: grafana/loki:3.7.10
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./services/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  # ----- observability stack - TEMPO -----
  tempo:
    image: grafana/tempo:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./services/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo

  # ----- observability stack - ALLOY -----
  alloy:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      ALLOY_OTLP_GRPC_PORT: ${ALLOY_OTLP_GRPC_PORT:?Set ALLOY_OTLP_GRPC_PORT in .env}
      ALLOY_OTLP_HTTP_PORT: ${ALLOY_OTLP_HTTP_PORT:?Set ALLOY_OTLP_HTTP_PORT in .env}
    ports:
      - "127.0.0.1:${ALLOY_OTLP_GRPC_PORT:?Set ALLOY_OTLP_GRPC_PORT in .env}:${ALLOY_OTLP_GRPC_PORT:?Set ALLOY_OTLP_GRPC_PORT in .env}"
      - "127.0.0.1:${ALLOY_OTLP_HTTP_PORT:?Set ALLOY_OTLP_HTTP_PORT in .env}:${ALLOY_OTLP_HTTP_PORT:?Set ALLOY_OTLP_HTTP_PORT in .env}"
    volumes:
      - ./services/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo

  # ----- connectivity stack - CLOUDFLARED -----
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    profiles: ["tunnel"]
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflared_token
    secrets:
      - cloudflared_token
    depends_on:
      - shortener

secrets:
  cloudflared_token:
    environment: CLOUDFLARE_TUNNEL_TOKEN

volumes:
  grafana-data:
  loki-data:
  tempo-data:
  alloy-data:
